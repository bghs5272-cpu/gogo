<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>세빛섬 가는 길 안내</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 어머님들이 읽기 편한 Noto Sans KR 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            word-break: keep-all; /* 단어가 중간에 끊기지 않게 설정 */
        }
        
        /* 부드러운 스크롤 적용 및 상단 헤더에 가려지지 않게 여백 설정 */
        html {
            scroll-behavior: smooth;
        }
        section {
            scroll-margin-top: 5rem; 
        }

        /* 이미지 반응형 처리: 원본 비율 유지하며 모바일 화면에 꽉 차게 */
        img {
            width: 100%;
            height: auto;
            display: block;
            border-bottom: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="antialiased text-gray-900">

    <header class="sticky top-0 z-50 bg-blue-700 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-4 flex justify-center items-center">
            <h1 class="text-2xl font-black tracking-tight">세빛섬 찾아가는 길</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-10 pb-20">
        
        <section id="step-1" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <img src="1.고속터미널역 8-1출구.jpg" alt="고속터미널역 8-1번 출구">
            <div class="p-6">
                <p class="text-2xl font-bold text-gray-800 leading-snug">
                    <span class="text-blue-600 font-black mr-2">1.</span>어머님, 고속터미널역 8-1번 출구에 내리셔서 그대로 직진해 주세요.
                </p>
            </div>
            <button onclick="document.getElementById('step-2').scrollIntoView()" class="w-full py-5 bg-blue-50 text-blue-700 font-bold text-2xl hover:bg-blue-100 transition-colors flex justify-center items-center">
                다음 안내 보기 <span class="ml-2 text-3xl">↓</span>
            </button>
        </section>

        <section id="step-2" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <img src="2.국민은행에서 우회전.jpg" alt="국민은행에서 우회전">
            <div class="p-6">
                <p class="text-2xl font-bold text-gray-800 leading-snug">
                    <span class="text-blue-600 font-black mr-2">2.</span>직진하시다가 국민은행이 보이면 우회전을 해 주세요.
                </p>
            </div>
            <button onclick="document.getElementById('step-3').scrollIntoView()" class="w-full py-5 bg-blue-50 text-blue-700 font-bold text-2xl hover:bg-blue-100 transition-colors flex justify-center items-center">
                다음 안내 보기 <span class="ml-2 text-3xl">↓</span>
            </button>
        </section>

        <section id="step-3" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <img src="3.지하차도.jpg" alt="지하차도로 들어가기">
            <div class="p-6">
                <p class="text-2xl font-bold text-gray-800 leading-snug">
                    <span class="text-blue-600 font-black mr-2">3.</span>그대로 직진하시다가 지하차도로 들어가 주세요.
                </p>
            </div>
            <button onclick="document.getElementById('step-4').scrollIntoView()" class="w-full py-5 bg-blue-50 text-blue-700 font-bold text-2xl hover:bg-blue-100 transition-colors flex justify-center items-center">
                다음 안내 보기 <span class="ml-2 text-3xl">↓</span>
            </button>
        </section>

        <section id="step-4" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <img src="4.지하차도 나와서 세빛섬 방면.jpg" alt="세빛섬 방면으로 들어가기">
            <div class="p-6">
                <p class="text-2xl font-bold text-gray-800 leading-snug">
                    <span class="text-blue-600 font-black mr-2">4.</span>지하차도로 나오셔서 세빛섬 방면(빨간색 원)으로 들어가 주세요.
                </p>
            </div>
            <button onclick="document.getElementById('step-5').scrollIntoView()" class="w-full py-5 bg-blue-50 text-blue-700 font-bold text-2xl hover:bg-blue-100 transition-colors flex justify-center items-center">
                다음 안내 보기 <span class="ml-2 text-3xl">↓</span>
            </button>
        </section>

        <section id="step-5" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <img src="5.저 건물로 직진.jpg" alt="건물을 향해 직진">
            <div class="p-6">
                <p class="text-2xl font-bold text-gray-800 leading-snug">
                    <span class="text-blue-600 font-black mr-2">5.</span>저 건물을 향해 앞으로 쭉 직진해 주세요.
                </p>
            </div>
            <button onclick="document.getElementById('step-6').scrollIntoView()" class="w-full py-5 bg-blue-50 text-blue-700 font-bold text-2xl hover:bg-blue-100 transition-colors flex justify-center items-center">
                다음 안내 보기 <span class="ml-2 text-3xl">↓</span>
            </button>
        </section>

        <section id="step-6" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-200">
            <img src="6.다리.jpg" alt="다리 건너기">
            <div class="p-6">
                <p class="text-2xl font-bold text-gray-800 leading-snug">
                    <span class="text-blue-600 font-black mr-2">6.</span>이 다리를 건너주세요.
                </p>
            </div>
            <button onclick="document.getElementById('step-7').scrollIntoView()" class="w-full py-5 bg-blue-50 text-blue-700 font-bold text-2xl hover:bg-blue-100 transition-colors flex justify-center items-center">
                다음 안내 보기 <span class="ml-2 text-3xl">↓</span>
            </button>
        </section>

        <section id="step-7" class="bg-blue-50 rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-400">
            <img src="7.도착.jpg" alt="세빛섬 도착">
            <div class="p-8 text-center">
                <p class="text-3xl font-black text-blue-800 leading-snug mb-4">
                    7. 무사히 도착하셨습니다!
                </p>
                <p class="text-xl text-gray-700 font-bold">
                    즐거운 시간 보내시길 바랍니다.
                </p>
            </div>
            <button onclick="window.scrollTo(0, 0)" class="w-full py-5 bg-blue-700 text-white font-bold text-2xl hover:bg-blue-800 transition-colors flex justify-center items-center mt-2">
                <span class="mr-2 text-3xl">↑</span> 맨 위로 다시 가기
            </button>
        </section>

    </main>
</body>
</html>
